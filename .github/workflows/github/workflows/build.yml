name: Build Digital Waqt & Azan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Install & Check Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Check project structure
        run: |
          echo "✅ Project files:"
          ls -la
          echo ""
          echo "✅ Checking package.json:"
          cat package.json
